.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.copybox{width:100%;min-height:160px;font:13px/1.5 var(--mono)}
.todo{display:flex;gap:10px;align-items:flex-start}

a.link{color:var(--fg);font-weight:600}

.preset.on{border-color:var(--ink)}
.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
input[type=color]{padding:2px;height:44px}
.welcome{display:grid;gap:10px;margin-top:14px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

function evacCost(ev){
  if(!ev||!ev.on)return 0;
  const site=S.cfg.decharges.find(d=>d.id===ev.site)||{t:0,f:0};
  const dump=Math.max(num(ev.t)*num(site.t),num(site.min))+num(site.f);
  return (dump+num(ev.km)*S.cfg.kmCost+num(ev.h)*S.cfg.taux)*(1+S.cfg.marge);
}
function devisTotals(d){
  const lignes=(d.lignes||[]).filter(l=>!l.opt).reduce((s,l)=>s+num(l.q)*num(l.p),0);const options=(d.lignes||[]).filter(l=>l.opt).reduce((s,l)=>s+num(l.q)*num(l.p),0);
  const ev=evacCost(d.evac);const ht=lignes+ev;const tva=ht*num(d.tva)/100;
  return{lignes,options,ev,ht,tva,ttc:ht+tva,acompte:(ht+tva)*num(d.acompte)/100,eh:num(d.heuresEst)?lignes/num(d.heuresEst):0};
}
function tauxFor(o){if(!o)return S.cfg.taux;const ch=o.chantierId&&S.chantiers.find(x=>x.id===o.chantierId);return num(o.taux)||(ch&&num(ch.taux))||num(client(o.clientId)?.taux)||S.cfg.taux}
function tauxPill(o){const t=tauxFor(o);return t!==S.cfg.taux?` <span class="pill">${t} €/h</span>`:""}
function isRegie(c){return c.mode?c.mode!=="devis":!S.devis.some(d=>d.chantierId===c.id&&["accepté","facturé"].includes(d.statut))}
function regieTotals(c){
  const hh=(c.heures||[]).reduce((s,h)=>s+num(h.hommes)*num(h.h),0);const taux=tauxFor(c);const mo=hh*taux;
  const coef=1+num(S.cfg.margeAchats)/100;
  const achatsL=(c.frais||[]).filter(f=>f.refact).map(f=>({n:(f.lib||f.cat),ht:num(f.montant)/(1+tvas()[0]/100)*coef}));
  const achats=achatsL.reduce((s,x)=>s+x.ht,0);
  const autres=(c.lignes||[]).reduce((s,l)=>s+num(l.q)*num(l.p),0);
  const ht=mo+achats+autres;const tx=num(client(c.clientId)?.tva??tvas()[0]);const tva=ht*tx/100;
  return{hh,taux,mo,achatsL,achats,autres,ht,tx,tva,ttc:ht+tva};
}

function restoreUI(){return confirmRestore?`<div class="banner" style="margin-top:8px">Sauvegarde du ${fdate((confirmRestore.date||"").slice(0,10))} : elle remplacera toutes les données de cet appareil.<div class="btns"><button class="btn" type="button" data-act="doRestore">Restaurer</button><button class="btn alt" type="button" data-act="cancelRestore">Annuler</button></div></div>`
  :`<div class="btns"><label class="btn alt filebtn">📂 Choisir le fichier<input type="file" accept="application/json,.json" data-restore="" aria-label="Choisir un fichier de sauvegarde"></label></div>`}
/* ---------- Accueil ---------- */
function vAccueil(){
  const mois=month();
  const attente=S.devis.filter(d=>d.statut==="envoyé");
  const aFacturer=S.devis.filter(d=>d.statut==="accepté");
  const sumAF=aFacturer.reduce((s,d)=>s+devisTotals(d).ht,0);
  const decs=S.decomptes.filter(d=>d.mois===mois);
  const decSum=decs.reduce((s,d)=>s+decTotals(d).montant,0);
  const gap=decs.reduce((s,d)=>s+decTotals(d).gap,0);
  const soon=S.chantiers.filter(c=>!FINI.includes(c.statut)).sort((a,b)=>(a.date||"9").localeCompare(b.date||"9")).slice(0,5);
  const relances=S.devis.filter(d=>d.statut==="envoyé"&&daysSince(d.sentAt||d.date)>=7);
  const dus=S.contrats.filter(k=>k.actif!==false&&k.prochain&&k.prochain<=addDays(today(),7));
  const fraisNS=[];S.chantiers.forEach(c=>(c.frais||[]).forEach(f=>{if(!f.smart)fraisNS.push(f)}));
  const sansTicket=S.chantiers.filter(c=>FINI.includes(c.statut)&&(c.checklist||[]).some(x=>x.t==="Ticket de pesée"&&!x.done));
  const y=String(new Date().getFullYear());
  const caDev=S.devis.filter(d=>["accepté","facturé"].includes(d.statut)&&(d.date||"").startsWith(y)).reduce((s,d)=>s+devisTotals(d).ht,0);
  const caDec=S.decomptes.filter(d=>(d.mois||"").startsWith(y)).reduce((s,d)=>s+decTotals(d).montant,0);
  let hhT=0,htT=0,frT=0;S.chantiers.filter(c=>FINI.includes(c.statut)).forEach(c=>{const st=chantierStats(c);if(st.hh){hhT+=st.hh;htT+=st.ht;frT+=st.frais}});
  const ehReel=hhT?(htT-frT)/hhT:0;
  const aEnvoyer=S.chantiers.filter(c=>c.statut==="terminé"&&isRegie(c));
  const impayes=S.chantiers.filter(c=>c.statut==="décompte envoyé"&&!c.decompteST);
  const sumImp=impayes.reduce((s,c)=>s+regieTotals(c).ttc,0);
  const caReg=S.chantiers.filter(c=>["décompte envoyé","payé"].includes(c.statut)&&isRegie(c)&&!c.decompteST&&(c.envoyeLe||c.date||"").startsWith(y)).reduce((s,c)=>s+regieTotals(c).ht,0);
  const todo=[
    ...aEnvoyer.map(c=>`<button class="card todo" type="button" data-open="chantiers:${c.id}"><span class="pill p-warn">Décompte</span><span><b>${esc(c.titre||c.type)} · ${esc(cname(c.clientId))}</b><br><span class="small">${client(c.clientId)?.type==="sous-traitance"?`Terminé : ajouter les ${hfmt(regieTotals(c).hh)} h au décompte de sous-traitance`:`Terminé : envoyer le décompte (${hfmt(regieTotals(c).hh)} h · ${eur(regieTotals(c).ttc)} TVAC)`}</span></span></button>`),
    ...impayes.filter(c=>daysSince(c.envoyeLe||c.date)>=15).map(c=>`<button class="card todo" type="button" data-open="chantiers:${c.id}"><span class="pill p-bad">Paiement</span><span><b>${esc(c.titre||c.type)} · ${esc(cname(c.clientId))}</b><br><span class="small">Décompte envoyé il y a ${daysSince(c.envoyeLe||c.date)} jours, pas encore payé · ${eur(regieTotals(c).ttc)}</span></span></button>`),
    ...relances.map(d=>`<button class="card todo" type="button" data-open="devis:${d.id}"><span class="pill p-warn">Relancer</span><span><b>${esc(d.numero)} · ${esc(cname(d.clientId))}</b><br><span class="small">Envoyé il y a ${daysSince(d.sentAt||d.date)} jours · ${eur(devisTotals(d).ht)} HTVA</span></span></button>`),
    ...dus.map(k=>`<div class="card todo"><span class="pill">Entretien</span><span style="flex:1"><b>${esc(k.titre)} · ${esc(cname(k.clientId))}</b><br><span class="small">Passage prévu le ${fdate(k.prochain)}</span><div class="btns" style="margin-top:6px"><button class="btn alt" type="button" data-act="passage" data-id="${k.id}">Planifier le passage</button></div></span></div>`),
    ...(S.cfg.notesFrais&&fraisNS.length?[`<div class="card todo"><span class="pill p-warn">Frais</span><span><b>${fraisNS.length} frais à déclarer en note de frais</b><br><span class="small">${eur(fraisNS.reduce((s,f)=>s+num(f.montant),0))} TVAC${S.cfg.outil?", à encoder chez "+esc(S.cfg.outil):""}</span></span></div>`]:[]),
    ...sansTicket.map(c=>`<button class="card todo" type="button" data-open="chantiers:${c.id}"><span class="pill">Ticket</span><span><b>${esc(c.titre)}</b><br><span class="small">Noter le poids net du ticket de pesée</span></span></button>`)];
  const rapN=S.rapports.filter(r=>r.statut!=="ajouté").length;
  return `<div class="row"><h1>Bonjour${S.cfg.prenom?" "+esc(S.cfg.prenom):""}</h1><button class="btn alt" type="button" data-act="apercu" style="padding:8px 12px">👀 Version ouvriers</button></div>${rapN?`<button class="card" type="button" data-tabgo="rapports" style="border:2px solid var(--green);margin-top:10px"><div class="row"><h3>📋 ${rapN} rapport${rapN>1?"s":""} d'ouvrier à voir</h3><span>›</span></div><div class="small">Heures, travail fait, déchets verts et photos envoyés par l'équipe.</div></button>`:""}<p class="small">${new Date().toLocaleDateString("fr-BE",{weekday:"long",day:"numeric",month:"long"})}</p>
  <div class="grid2" style="margin-top:12px">
    <div class="stat"><span class="small">Décomptes envoyés, pas encore payés</span><b>${eur(sumImp)}</b><span class="small">${impayes.length} chantier(s) · TVAC${aFacturer.length?" · + "+eur(sumAF)+" de devis à facturer":""}</span></div>
    ${S.cfg.sousTraitance?`<div class="stat"><span class="small">Sous-traitance ce mois</span><b>${eur(decSum)}</b><span class="small">${gap>0?"dont "+eur(gap)+" au-dessus du tarif payé":"au tarif de "+S.cfg.taux+" €/h"}</span></div>`:`<div class="stat"><span class="small">Chantiers en cours ou prévus</span><b>${S.chantiers.filter(c=>!FINI.includes(c.statut)).length}</b><span class="small">${S.clients.length} client(s) enregistré(s)</span></div>`}
  </div>
  ${todo.length?`<h2>À faire</h2>${todo.join("")}`:""}
  <h2>Prochains chantiers</h2>
  ${soon.length?soon.map(cardChantier).join(""):`<div class="card empty">Aucun chantier prévu.<div class="btns" style="justify-content:center"><button class="btn" type="button" data-act="newChantier">Nouveau chantier</button></div></div>`}
  <h2>Devis en attente de réponse</h2>
  ${attente.length?attente.map(cardDevis).join(""):`<p class="small">Aucun devis envoyé en attente.</p>`}
  <h2>Année ${y}</h2>
  <div class="grid2">
    <div class="stat"><span class="small">Chiffre d'affaires HTVA</span><b>${eur(caReg+caDev+caDec)}</b><span class="small">Régie ${eur(caReg)} · devis ${eur(caDev)}${S.cfg.sousTraitance?" · sous-traitance "+eur(caDec):""}</span></div>
    <div class="stat"><span class="small">Gagné par heure-homme (chantiers terminés)</span><b>${ehReel?eur(ehReel):"–"}</b><span class="small">${ehReel?(ehReel>=S.cfg.taux?"au-dessus":"en dessous")+" de l'objectif de "+S.cfg.taux+" €":"Pointez les heures sur vos chantiers"}</span></div>
  </div>
  <div class="btns"><button class="btn" type="button" data-act="newChantier">+ Chantier</button><button class="btn" type="button" data-act="newDevis">+ Devis</button><button class="btn" type="button" data-act="newClient">+ Client</button><button class="btn alt" type="button" data-tabgo="clients">👤 Mes clients</button>${S.cfg.sousTraitance?`<button class="btn alt" type="button" data-act="newDecompte">+ Jour de sous-traitance</button>`:""}<button class="btn alt" type="button" data-tabgo="contrats">Contrats d'entretien</button></div>`;
}

/* ---------- Chantiers ---------- */

}

function cardDecompte(c,top){const t=regieTotals(c);const fr=(c.frais||[]).reduce((s,f)=>s+num(f.montant),0);return`<h2>${top?"✅ Décompte prêt à envoyer":"Décompte à envoyer"}</h2>

    <details style="margin-top:10px" ${top?"open":""}><summary class="small" style="cursor:pointer;font-weight:600">Aperçu du message au client</summary><div class="small" style="white-space:pre-wrap;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)">${esc(regieText(c,true))}</div></details>

const chantierRempli=c=>route.id!=="new"&&c.mode!=="devis"&&client(c.clientId)?.type!=="sous-traitance"&&(c.heures||[]).some(h=>num(h.h)*num(h.hommes)>0);
const openSec={};
const chantierFini=c=>chantierRempli(c)&&["terminé","décompte envoyé","payé"].includes(c.statut);
const telIntl=t=>{t=(t||"").replace(/[^\d+]/g,"");if(t.startsWith("+"))return t.slice(1);if(t.startsWith("00"))return t.slice(2);if(t.startsWith("0"))return (S.cfg.indicatif||"32")+t.slice(1);return t};
function cardStatut(c){
  const steps=[["en cours","Travaux"],["terminé","Terminé"],["décompte envoyé","Décompte envoyé"],["payé","Payé"]];
  const idx=c.statut==="prévu"?-1:steps.findIndex(x=>x[0]===c.statut);

   :c.statut==="terminé"?`<p class="small" style="margin:8px 0 0">À faire : envoyer le décompte de <b>${eur(t.ttc)}</b> à ${esc(cl.nom||"client")}.</p>
     <div class="btns"><a class="btn" href="sms:${esc(cl.tel||"")}?&body=${enc}">💬 SMS</a><a class="btn" href="https://wa.me/${esc(telIntl(cl.tel))}?text=${enc}" target="_blank" rel="noopener">WhatsApp</a><a class="btn" href="mailto:${esc(cl.email||"")}?subject=${encodeURIComponent("Décompte "+(c.titre||c.type)+" - "+ent())}&body=${enc}">✉️ E-mail</a><button class="btn alt" type="button" data-act="copyRegie">Copier</button></div>
     <div class="btns"><button class="btn alt" type="button" data-act="markEnvoye">✔ Marquer le décompte envoyé</button><button class="btn alt" type="button" data-act="copyRegieSmart">Copier pour ${esc(outil())}</button></div>`
   :`<div class="btns"><button class="btn" type="button" data-act="markTermine">✔ Chantier terminé</button></div>`;
  return `<div class="card" style="border:2px solid var(--green)">

function cardResume(c){const t=regieTotals(c);const b=benefice(c);const cl=client(c.clientId)||{};const a=adrReelle(c.adresse,c.clientId);
  const ds=(c.heures||[]).map(h=>h.d).filter(Boolean).sort();
  return `<div class="card"><div class="row"><button type="button" data-open="clients:${c.clientId}" style="background:none;border:0;padding:0;font:700 16px var(--font);color:var(--fg);text-align:left;cursor:pointer">👤 ${esc(cl.nom||"")} ›</button><span class="small">${ds.length?fdate(ds[0])+(ds.length>1&&ds[ds.length-1]!==ds[0]?" → "+fdate(ds[ds.length-1]):""):""}</span></div>

  <div class="tot" style="margin-top:8px"><span>${hfmt(t.hh)} h de travail · ${b.jours} jour(s)</span><span class="num">${eur(t.mo)}</span><span>Frais et achats</span><span class="num">${eur(t.autres+t.achats)}</span><span class="big">À facturer TVAC</span><span class="num big">${eur(t.ttc)}</span><span>Mon bénéfice estimé</span><span class="num" style="font-weight:700;color:${b.net<0?"var(--bad)":"inherit"}">${eur(b.net)}</span></div></div>`}
const sec=(k,title,html,open)=>`<details data-sec="${k}" ${(openSec[k]??open)?"open":""} style="margin-top:12px"><summary style="cursor:pointer;font-weight:600;padding:10px 0">${title}</summary>${html}</details>`;
function fChantier(){
  const c=draft||(draft=route.id==="new"?{id:uid(),clientId:route.sub||"",titre:"",type:"",adresse:client(route.sub)?.adresse||"",date:today(),statut:"prévu",mode:"régie",kit:[],lignes:fraisDefaut(),note:"",m3:"",created:today()}:JSON.parse(JSON.stringify(S.chantiers.find(x=>x.id===route.id)||{})));
  if(c&&c.id){c.photos=c.photos||[];c.kit=c.kit||[];c.checklist=c.checklist||[];c.heures=c.heures||[];c.frais=c.frais||[];c.lignes=c.lignes||[];if(!c.mode)c.mode=isRegie(c)?"régie":"devis"}
  if(!c||!c.id)return`<div class="empty">Chantier introuvable.</div>`;

  <div class="card">
    ${c.lignes.map((l,i)=>`<div class="line" style="grid-template-columns:minmax(0,1fr) 56px 76px 36px"><input aria-label="Libellé" data-a="lignes" data-i="${i}" data-k="n" value="${esc(l.n)}"><input aria-label="Quantité" inputmode="decimal" data-a="lignes" data-i="${i}" data-k="q" value="${esc(l.q)}"><input aria-label="Prix HTVA" inputmode="decimal" data-a="lignes" data-i="${i}" data-k="p" value="${esc(l.p)}"><button class="x" type="button" data-adel="lignes" data-i="${i}" aria-label="Retirer">×</button></div>`).join("")||'<p class="small">Déplacement, évacuation des déchets, location de remorque…</p>'}

function clientSelect(id,f,val){
  const list=[...S.clients].sort((a,b)=>a.nom.localeCompare(b.nom,"fr"));
  const nc=draft&&draft._nc;
  return `<select id="${id}" data-f="${f}"><option value="">Choisir un client…</option><option value="__new" ${nc?"selected":""}>➕ Nouveau client…</option>${list.map(c=>`<option value="${c.id}" ${c.id===val&&!nc?"selected":""}>${esc(c.nom)}</option>`).join("")}</select>
  ${nc?`<div class="card" style="margin-top:8px"><b>Nouveau client</b>
    <label for="nc_nom">Nom</label><input id="nc_nom" data-nc="nom" value="${esc(nc.nom)}" autocomplete="off">
    <div class="grid2"><div><label for="nc_tel">Téléphone</label><input id="nc_tel" type="tel" data-nc="tel" value="${esc(nc.tel)}"></div><div><label for="nc_mail">E-mail</label><input id="nc_mail" type="email" data-nc="email" value="${esc(nc.email)}"></div></div>
    <label for="nc_adr">Adresse</label><input id="nc_adr" data-nc="adresse" value="${esc(nc.adresse)}" placeholder="Rue, numéro, code postal, commune">${mapLink("nc_adr",nc.adresse)}
    <label for="nc_type">Type</label><select id="nc_type" data-nc="type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${nc.type===k?"selected":""}>${v}</option>`).join("")}</select>
    <p class="small">Le client est créé en même temps que vous enregistrez.</p></div>`:""}`;
}

/* ---------- Devis ---------- */
function cardDevis(d){
  const t=devisTotals(d);const cls={accepté:"p-ok",facturé:"p-ok",refusé:"p-bad",envoyé:"p-warn"}[d.statut]||"";
  return `<button class="card" type="button" data-open="devis:${d.id}"><div class="row"><h3>${esc(d.numero)} · ${esc(cname(d.clientId))}</h3><span class="pill ${cls}">${esc(d.statut)}</span></div><div class="row small"><span>${fdate(d.date)}${d.objet?" · "+esc(d.objet):""}</span><span class="num">${eur(t.ht)} HTVA</span></div></button>`;
}
function vDevis(){
  if(route.id)return fDevis();
  const list=[...S.devis].sort((a,b)=>(b.numero||"").localeCompare(a.numero||""));
  return `<div class="row"><h1>Devis</h1><button class="btn" type="button" data-act="newDevis">+ Devis</button></div>
  <div style="margin-top:12px">${list.length?list.map(cardDevis).join(""):`<div class="empty">Aucun devis. Les prix viennent de votre grille.</div>`}</div>`;
}
function fDevis(){
  let d=draft;
  if(!d){
    if(route.id==="new"){
      const ch=route.sub&&S.chantiers.find(c=>c.id===route.sub);const cli=ch?ch.clientId:(route.sub&&client(route.sub)?route.sub:"");
      const site=S.cfg.decharges[0];
      d={id:uid(),numero:nextNumero(),clientId:cli,chantierId:ch?ch.id:"",objet:ch?ch.titre||ch.type:"",date:today(),lignes:[],tva:num(client(cli)?.tva??tvas()[0]),
         evac:{on:!!(ch&&num(ch.m3)),site:site?.id||"",t:ch&&num(ch.m3)?+(num(ch.m3)*0.3).toFixed(2):0.25,km:site?site.km*2:18,h:site?+((site.km*2/30)+0.75).toFixed(2):1.5},statut:"brouillon",created:today()};
    }else{const src=S.devis.find(x=>x.id===route.id);if(!src)return`<div class="empty">Devis introuvable.</div>`;d=JSON.parse(JSON.stringify(src))}
    draft=d;
  }
  const t=devisTotals(d);const ev=d.evac||{};
  const chs=S.chantiers.filter(c=>!d.clientId||c.clientId===d.clientId);
  return `<button class="back" type="button" data-tabgo="devis">‹ Devis</button><h1>${esc(d.numero)}</h1>
  <label for="d_cli">Client</label>${clientSelect("d_cli","clientId",d.clientId)}
  <div class="grid2"><div><label for="d_ch">Chantier</label><select id="d_ch" data-f="chantierId"><option value="">Aucun</option>${chs.map(c=>`<option value="${c.id}" ${c.id===d.chantierId?"selected":""}>${esc(c.titre||c.type)} · ${fdate(c.date)}</option>`).join("")}</select></div>
  <div><label for="d_date">Date</label><input id="d_date" type="date" data-f="date" value="${esc(d.date)}"></div></div>
  <label for="d_obj">Objet</label><input id="d_obj" data-f="objet" value="${esc(d.objet)}" placeholder="Ex. Élagage et rabattage de haies">
  <h2>Prestations de votre grille</h2>
  <div class="chips">${S.cfg.catalogue.map((c,i)=>`<button type="button" class="chip" data-cat="${i}">+ ${esc(c.n)}</button>`).join("")||'<span class="small">Catalogue vide : voir Réglages.</span>'}</div>
  <div class="card" style="margin-top:10px">
    <div class="line small" style="border:0;padding-top:0"><span>Prestation</span><span>Qté</span><span>Prix € HT</span><span></span></div>
    ${(d.lignes||[]).map((l,i)=>`<div class="line"><div><input aria-label="Prestation" data-l="${i}" data-lf="n" value="${esc(l.n)}"><div class="small">${esc(l.u)} · ${eur(num(l.q)*num(l.p))}</div><label class="opt"><input type="checkbox" data-l="${i}" data-lf="opt" ${l.opt?"checked":""}> option (hors total)</label></div><input aria-label="Quantité" inputmode="decimal" data-l="${i}" data-lf="q" value="${esc(l.q)}"><input aria-label="Prix unitaire" inputmode="decimal" data-l="${i}" data-lf="p" value="${esc(l.p)}"><button class="x" type="button" data-dell="${i}" aria-label="Retirer la ligne">×</button></div>`).join("")||'<p class="small">Touchez une prestation ci-dessus pour l\'ajouter.</p>'}
    <div class="btns" style="margin-top:8px"><button class="btn alt" type="button" data-act="addLine">+ Ligne libre</button></div>
  </div>
  <h2>Évacuation déchets verts</h2>
  <div class="card">
    <label style="display:flex;gap:8px;align-items:center;margin:0;color:var(--fg)"><input type="checkbox" data-ev="on" ${ev.on?"checked":""} style="width:auto;min-height:0"> Ajouter une ligne d'évacuation</label>
    ${ev.on?`<label for="e_site">Décharge (privées uniquement)</label><select id="e_site" data-ev="site">${S.cfg.decharges.map(s=>`<option value="${s.id}" ${s.id===ev.site?"selected":""}>${esc(s.n)} · ${s.t?s.t+" €/t":s.f?s.f+" €/visite":"prix à demander"}${s.min?", min. "+s.min+" €":""}</option>`).join("")}</select>${S.cfg.decharges.length?"":'<p class="small">Ajoutez vos décharges et leurs prix dans Réglages.</p>'}
    <div class="grid2"><div><label for="e_t">Poids (t)</label><input id="e_t" inputmode="decimal" data-ev="t" value="${esc(ev.t)}"></div><div><label for="e_km">Km aller-retour</label><input id="e_km" inputmode="decimal" data-ev="km" value="${esc(ev.km)}"></div></div>
    <label for="e_h">Temps (route, file, pesée, déchargement) en heures</label><input id="e_h" inputmode="decimal" data-ev="h" value="${esc(ev.h)}">
    <p class="small" style="margin-top:8px">Coût réel + ${Math.round(S.cfg.marge*100)} % : <b class="num">${eur(t.ev)}</b>. Après le voyage, remplacez le poids par le poids net du ticket.</p>`:""}
  </div>
  <div class="card">
    <div class="grid2"><div><label for="d_tva">TVA</label><select id="d_tva" data-f="tva">${tvas().map(v=>`<option value="${v}" ${num(d.tva)===v?"selected":""}>${String(v).replace(".",",")} %</option>`).join("")}</select></div>
    <div><label for="d_st">Statut</label><select id="d_st" data-f="statut">${DSTAT.map(s=>`<option ${d.statut===s?"selected":""}>${s}</option>`).join("")}</select></div></div>
    <div class="grid2"><div><label for="d_he">Heures-homme prévues</label><input id="d_he" inputmode="decimal" data-f="heuresEst" value="${esc(d.heuresEst||"")}"></div>
    <div><label for="d_ac">Acompte (%)</label><input id="d_ac" inputmode="decimal" data-f="acompte" value="${esc(d.acompte||"")}"></div></div>
    <label for="d_val">Validité du devis (jours)</label><input id="d_val" inputmode="numeric" data-f="validite" value="${esc(d.validite||"")}" placeholder="30">
    ${t.eh?(()=>{const tx=tauxFor(d);return`<p style="margin-top:8px"><span class="pill ${t.eh>=tx?"p-ok":"p-bad"}">${eur(t.eh)} par heure-homme</span> <span class="small">${t.eh>=tx?"objectif de "+tx+" € atteint":"sous l'objectif de "+tx+" € : augmentez le prix ou réduisez le temps"}</span></p>`})():""}

    ${num(d.tva)===6&&S.cfg.pays==="BE"?'<p class="small" style="margin-top:8px">TVA 6 % : logement privé de plus de 10 ans, attestation du client à joindre.</p>':""}

function devisText(d){
  const t=devisTotals(d);const L=[];
  L.push(`Devis ${d.numero} du ${fdate(d.date)}`,`Client : ${cname(d.clientId)}`);if(d.objet)L.push(`Objet : ${d.objet}`);L.push("");
  (d.lignes||[]).filter(l=>!l.opt).forEach(l=>L.push(`${l.n} : ${l.q} ${l.u} × ${eur(l.p)} = ${eur(num(l.q)*num(l.p))} HTVA`));
  if(d.evac&&d.evac.on){const s=S.cfg.decharges.find(x=>x.id===d.evac.site);L.push(`Évacuation déchets verts (${d.evac.t} t, ${s?s.n:"décharge"}) : ${eur(t.ev)} HTVA`)}
  L.push("",`Total HTVA : ${eur(t.ht)}`,`TVA ${num(d.tva)} % : ${eur(t.tva)}`,`Total TVAC : ${eur(t.ttc)}`);
  if(num(d.tva)===0)L.push("Autoliquidation : TVA due par le cocontractant.");
  if(t.acompte)L.push(`Acompte à la commande (${num(d.acompte)} %) : ${eur(t.acompte)}`);
  const opts=(d.lignes||[]).filter(l=>l.opt);if(opts.length){L.push("","Options (non comprises dans le total) :");opts.forEach(l=>L.push(`${l.n} : ${l.q} ${l.u} × ${eur(l.p)} = ${eur(num(l.q)*num(l.p))} HTVA`))}
  L.push("",`Devis valable ${num(d.validite)||30} jours.`);if(S.cfg.conditions)L.push(S.cfg.conditions);
  return L.join("\n");
}

function messageText(kind,obj){
  const c=client(obj.clientId)||{};const nom=(c.nom||"").split(" ")[0]||"";
  const bonjour=c.type==="particulier"?`Bonjour ${nom},`:"Bonjour,";
  const sign="\n\n"+signLines().join("\n");
  if(kind==="confirm")return`${bonjour}\n\nJe vous confirme notre passage le ${fdate(obj.date)} pour : ${obj.titre||obj.type}.\nN'hésitez pas à me prévenir si l'accès pose problème.${sign}`;
  if(kind==="veille")return`${bonjour}\n\nPetit rappel : nous passons demain (${fdate(obj.date)}) pour ${(obj.titre||obj.type||"").toLowerCase()}. Merci de laisser l'accès libre${obj.type==="Terrasse"||obj.type==="Toiture"?" et un robinet d'eau disponible":""}.${sign}`;
  if(kind==="fini")return`${bonjour}\n\nLe chantier « ${obj.titre||obj.type} » est terminé. Je vous envoie le décompte des heures et des achats dans les prochains jours. Merci pour votre confiance !${sign}`;
  if(kind==="avis")return`${bonjour}\n\nMerci encore pour votre confiance. Si vous êtes satisfait du travail, un avis sur notre fiche Google « ${ent()} » nous aiderait beaucoup. ${S.cfg.avisLien?"Voici le lien : "+S.cfg.avisLien:"Il suffit de chercher "+ent()+" sur Google Maps et de cliquer sur « Donner un avis »."}${sign}`;
  if(kind==="relancePaie"){const t=regieTotals(obj);return`${bonjour}\n\nSauf erreur de ma part, le décompte des travaux « ${obj.titre||obj.type} » envoyé le ${fdate(obj.envoyeLe||obj.date)} (${eur(t.ttc)} TVAC) n'est pas encore réglé. Pourriez-vous faire le nécessaire ? Si c'est déjà fait, merci de ne pas tenir compte de ce message.${sign}`}
  if(kind==="relance")return`${bonjour}\n\nJe reviens vers vous concernant le devis ${obj.numero} (${obj.objet||"travaux"}) envoyé le ${fdate(obj.sentAt||obj.date)}. Avez-vous pu le regarder ? Je reste disponible pour l'ajuster ou en parler.${sign}`;
  return"";
}

function decompteText(dc){

    if(route.tab==="contrats"&&["freqSem","moisDebut","moisFin","prixPassage"].includes(el.dataset.f)){softTotals();return}

function rerender(){const m=document.getElementById("main");const y=window.scrollY;m.dataset.form="";const banner=online?"":m.querySelector(".banner")?.outerHTML||"";m.innerHTML=banner+apercuBar()+(VIEWS[route.tab]||vAccueil)();m.dataset.form=route.tab+":"+(route.id||"");window.scrollTo(0,y)}
let softT;function softTotals(){clearTimeout(softT);softT=setTimeout(()=>{const a=document.activeElement;const key=a&&(a.dataset.l!==undefined?`[data-l="${a.dataset.l}"][data-lf="${a.dataset.lf}"]`:a.dataset.j!==undefined?`[data-j="${a.dataset.j}"][data-jf="${a.dataset.jf}"]`:a.dataset.a?`[data-a="${a.dataset.a}"][data-i="${a.dataset.i}"][data-k="${a.dataset.k}"]`:a.dataset.ev?`[data-ev="${a.dataset.ev}"]`:a.id?"#"+a.id:null);const pos=a&&a.selectionStart;rerender();if(key){const n=document.querySelector(key);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}},500)}

function shrink(file,max,q){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);cv.toBlob(b=>b?res(b):rej(new Error("conversion")),"image/jpeg",q)};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("image illisible"))};img.src=u})}
function logoData(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const S2=256;const cv=document.createElement("canvas");cv.width=cv.height=S2;const x=cv.getContext("2d");x.fillStyle="#ffffff";x.fillRect(0,0,S2,S2);const k=Math.min(S2/img.width,S2/img.height)*0.9;const w=img.width*k,h=img.height*k;x.drawImage(img,(S2-w)/2,(S2-h)/2,w,h);URL.revokeObjectURL(u);res(cv.toDataURL("image/png"))};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("image"))};img.src=u})}
function blobToData(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}
main.addEventListener("change",async e=>{
  const el=e.target;
  if(el.dataset.logo!==undefined&&draft){const f=el.files&&el.files[0];el.value="";if(!f)return;try{draft.logo=await logoData(f);applyBrand(draft);rerender();toast("Logo ajouté : enregistrez les réglages.")}catch(err){toast("Image illisible : essayez une autre (PNG ou JPEG).")}return}
  if(el.dataset.restore!==undefined){const f=el.files&&el.files[0];el.value="";if(f)await restoreBackup(f);return}
  if(el.dataset.photo===undefined||!draft)return;

  draft.photos=draft.photos||[];toast(files.length>1?files.length+" photos en cours d'envoi…":"Photo en cours d'envoi…");

});

async function exportCsv(kind){
  let rows=[];
  if(kind==="devis"){rows=[["Numéro","Date","Client","Objet","Statut","HTVA","TVA %","TVA","TVAC"]];S.devis.forEach(d=>{const t=devisTotals(d);rows.push([d.numero,d.date,cname(d.clientId),d.objet||"",d.statut,+t.ht.toFixed(2),num(d.tva),+t.tva.toFixed(2),+t.ttc.toFixed(2)])})}

}
async function download(filename,data,type){
  let dl=null;try{dl=window.claude?.use?await window.claude.use("downloads"):null}catch(e){}
  if(dl){try{await dl.save({filename,data});return true}catch(e){if(e&&e.code!=="declined")toast("Téléchargement refusé ("+(e.code||"erreur")+").");return false}}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return true}catch(e){toast("Téléchargement impossible sur cet appareil.");return false}
}

  ${r.missionId==="autre"?`<label for="r_lieu">Où ? (client, adresse)</label><input id="r_lieu" data-f="lieu" value="${esc(r.lieu)}">`:""}
  <div class="grid2"><div><label for="r_date">Date</label><input id="r_date" type="date" data-f="date" value="${esc(r.date)}"></div>
  <div><label for="r_h">Heures travaillées</label><input id="r_h" inputmode="decimal" data-f="heures" value="${esc(r.heures)}" placeholder="Ex. 7,5"></div>
  <div><label for="r_hom">Nombre de personnes (vous compris)</label><input id="r_hom" inputmode="numeric" data-f="hommes" value="${esc(r.hommes)}"></div></div>
  <label for="r_trav">Travail fait</label><textarea id="r_trav" data-f="travail" placeholder="Ex. taille des haies côté rue, tonte, ramassage">${esc(r.travail)}</textarea>
  ${m&&(m.checklist||[]).length?`<label>Coché aujourd'hui</label><div class="chips">${m.checklist.map(t=>{const on=r.fait.includes(t);return`<button type="button" class="chip ${on?"on":""}" aria-pressed="${on}" data-w="fait" data-t="${esc(t)}">${on?"✓ ":""}${esc(t)}</button>`}).join("")}</div>`:""}
  <label class="opt" style="margin-top:14px"><input type="checkbox" data-f="dechets" ${r.dechets?"checked":""}> Il y a des déchets verts</label>
  ${r.dechets?`<div class="grid2"><div><label for="r_m3">Volume (m³ environ)</label><input id="r_m3" inputmode="decimal" data-f="m3" value="${esc(r.m3)}"></div><div><label for="r_voy">Voyages à la décharge</label><input id="r_voy" inputmode="numeric" data-f="voyages" value="${esc(r.voyages)}"></div></div>
  <label for="r_dech">Décharge</label><input id="r_dech" data-f="decharge" value="${esc(r.decharge)}" placeholder="Nom de la décharge">`:""}
  <label for="r_mat">Achats ou matériel utilisé</label><textarea id="r_mat" data-f="materiel" placeholder="Ex. 3 sacs de terreau. Gardez le ticket pour le patron.">${esc(r.materiel)}</textarea>
  <label for="r_diff">Problèmes ou difficultés</label><textarea id="r_diff" data-f="difficultes" placeholder="Ex. allée trop étroite pour la remorque">${esc(r.difficultes)}</textarea>
  <p class="small" style="margin-top:12px">📷 Photos : après l'envoi, ajoutez-les dans la même conversation WhatsApp.</p>
  <div class="btns" style="margin-top:18px"><button class="btn full" type="button" data-w="envoyer">Envoyer le rapport au patron</button></div>`;
}
function rapportText(r){const m=S.missions.find(x=>x.id===r.missionId);const{photos,...o}=r;
  return[`Rapport de ${r.auteurNom} · ${fdate(r.date)}`,`Chantier : ${m?m.titre+" · "+m.client:r.lieu||"autre"}`,`Heures : ${r.heures} h × ${r.hommes} pers.`,r.travail?`Travail fait : ${r.travail}`:"",(r.fait||[]).length?`Coché : ${r.fait.join(" · ")}`:"",r.dechets?`Déchets verts : ${r.m3||"?"} m³, ${r.voyages||0} voyage(s)${r.decharge?" à "+r.decharge:""}`:"",r.materiel?`Achats / matériel : ${r.materiel}`:"",r.difficultes?`Difficultés : ${r.difficultes}`:"",`\nPour l'ajouter dans l'app : ${APP_URL}#r=${enc64({v:1,...o})}`].filter(Boolean).join("\n")}
function vMesRapports(){
  const l=S.rapports.sort((a,b)=>(b.envoyeLe||b.date||"").localeCompare(a.envoyeLe||a.date||""));const top=route.sub&&l.find(r=>r.id===route.sub);
  return `<h1>Mes rapports</h1>${top?shareBox(rapportText(top),S.cfg.patronTel,"Dernière étape : envoyez le rapport à "+(S.cfg.patronNom||"votre patron")):""}${l.length?l.map(r=>{const m=S.missions.find(x=>x.id===r.missionId);return`<div class="card"><div class="row"><h3>${esc(m?m.titre+" · "+m.client:r.lieu||"Chantier")}</h3><span class="pill">${fdate(r.date)}</span></div><div class="small">${esc(r.heures)} h · ${esc(r.hommes)} pers.</div><p class="small">${esc(r.travail)}</p>${r.id!==route.sub?`<button class="chip" type="button" data-w="renvoi" data-id="${esc(r.id)}">↻ Renvoyer au patron</button>`:""}</div>`}).join(""):`<div class="empty">Aucun rapport envoyé.</div>`}`;
}
/* --- vue patron : rapports reçus --- */
function vRapports(){
  if(route.id){const r=S.rapports.find(x=>x.id===route.id);if(!r)return`<div class="empty">Rapport introuvable.</div>`;
    const c=S.chantiers.find(x=>x.id===r.missionId);
    return `<button class="back" type="button" data-tabgo="rapports">‹ Rapports</button><h1>Rapport de ${esc(r.auteurNom||"l'ouvrier")}</h1>
    <div class="card"><div class="tot"><span>Chantier</span><span>${esc(c?(c.titre||c.type)+" · "+cname(c.clientId):r.lieu||"Autre")}</span><span>Date</span><span>${fdate(r.date)}</span><span>Heures</span><span>${esc(r.heures)} h × ${esc(r.hommes)} pers.</span>${r.dechets?`<span>Déchets verts</span><span>${esc(r.m3||"?")} m³ · ${esc(r.voyages||"0")} voyage(s)${r.decharge?" · "+esc(r.decharge):""}</span>`:""}</div>
    ${r.travail?`<p><b>Travail fait :</b> ${esc(r.travail)}</p>`:""}${(r.fait||[]).length?`<p class="small">Coché : ${r.fait.map(esc).join(" · ")}</p>`:""}
    ${r.materiel?`<p><b>Achats / matériel :</b> ${esc(r.materiel)}</p>`:""}${r.difficultes?`<p><b>Difficultés :</b> ${esc(r.difficultes)}</p>`:""}
    ${renderPhotos(r.photos)}</div>
    <div class="btns">${r.statut!=="ajouté"?(c?`<button class="btn" type="button" data-act="rapAjout">Ajouter au chantier</button>`:"")+`<button class="btn alt" type="button" data-act="rapLu">Marquer comme vu</button>`:`<p class="small">✅ Ajouté au chantier${r.ajouteLe?" le "+fdate(r.ajouteLe):""}.</p>`}${c?`<button class="btn alt" type="button" data-open="chantiers:${c.id}">Ouvrir le chantier</button>`:""}</div>`}
  const l=[...S.rapports].sort((a,b)=>(a.statut==="ajouté")-(b.statut==="ajouté")||(b.date||"").localeCompare(a.date||""));
  return `<button class="back" type="button" data-tabgo="accueil">‹ Accueil</button><h1>Rapports des ouvriers</h1>
  <div class="card"><label for="pasteIn">Coller un rapport reçu par WhatsApp</label><textarea id="pasteIn" placeholder="Si le lien ne s'ouvre pas dans l'app, collez ici le message de l'ouvrier"></textarea><div class="btns"><button class="btn" type="button" data-act="importColle">Ajouter le rapport</button></div></div>
  ${l.length?l.map(r=>{const c=S.chantiers.find(x=>x.id===r.missionId);return`<button class="card" type="button" data-open="rapports:${r.id}"><div class="row"><h3>${esc(r.auteurNom||"Ouvrier")} · ${fdate(r.date)}</h3><span class="pill ${r.statut==="ajouté"?"p-ok":"p-warn"}">${r.statut==="ajouté"?"ajouté":"à voir"}</span></div><div class="small">${esc(c?(c.titre||c.type)+" · "+cname(c.clientId):r.lieu||"Autre")} · ${esc(r.heures)} h × ${esc(r.hommes)}</div></button>`}).join(""):`<div class="empty">Aucun rapport reçu. Envoyez un chantier à un ouvrier depuis sa fiche (bouton « Envoyer ce chantier à un ouvrier »).</div>`}`;
}
async function rapportAjout(r,marquerSeul){
  const upd={statut:"ajouté",ajouteLe:today()};
  if(!marquerSeul){const c0=S.chantiers.find(x=>x.id===r.missionId);if(!c0){toast("Chantier introuvable.");return}
    const c=JSON.parse(JSON.stringify(c0));c.heures=c.heures||[];c.heures.push({d:r.date,hommes:String(r.hommes||1),h:String(r.heures||0).replace(",",".")});
    const who=r.auteurNom?" ("+r.auteurNom+")":"";
    if(r.travail)c.travaux=(c.travaux?c.travaux.trim()+"; ":"")+r.travail.trim();
    (c.checklist||[]).forEach(x=>{if((r.fait||[]).includes(x.t))x.done=true});
    c.photos=[...(c.photos||[]),...(r.photos||[])];
    if(r.dechets){if(num(r.m3))c.m3=String(num(c.m3)+num(r.m3));const v=num(r.voyages);if(v){c.lignes=c.lignes||[];const l=c.lignes.find(x=>/évacuation/i.test(x.n)&&/voyage/i.test(x.n));if(l){l.q=c.evacRap?num(l.q)+v:v}else c.lignes.push({n:"Évacuation déchets verts (voyage)",q:v,p:prixVoyage()});c.evacRap=true}}
    const notes=[r.materiel&&"Achats/matériel"+who+" : "+r.materiel,r.difficultes&&"Difficultés"+who+" : "+r.difficultes].filter(Boolean);
    if(notes.length)c.note=((c.note||"").trim()+"\n"+fdate(r.date)+" · "+notes.join(" · ")).trim();
    if(c.statut==="prévu")c.statut="en cours";
    if(!await save("chantiers",c))return}
  const{id,...d}=r;if(await save(EQ.rapports,{id,...d,...upd},marquerSeul?"Rapport marqué vu.":"Ajouté au chantier : heures, travail, photos et déchets."))rerender();
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-w]");if(!b||role!=="ouvrier")return;
  if(b.dataset.w==="retour"){apercu=false;role="patron";go("accueil");return}
  if(b.dataset.w==="rap"){go("rapport",null,b.dataset.mid);return}
  if(b.dataset.w==="renvoi"){go("mesrapports",null,b.dataset.id);return}
  if(b.dataset.w==="fini"){if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Confirmer : retirer";return}await store.remove(EQ.missions,b.dataset.mid);toast("Chantier retiré de votre liste.");return}
  if(b.dataset.w==="fait"){const t=b.dataset.t;draft.fait=draft.fait.includes(t)?draft.fait.filter(x=>x!==t):[...draft.fait,t];rerender();return}
  if(b.dataset.w==="envoyer"){const r=draft;
    if(!r.auteurNom.trim()){toast("Indiquez votre prénom.");return}if(!r.missionId){toast("Choisissez le chantier.");return}if(!num(r.heures)){toast("Indiquez les heures travaillées.");return}
    if(apercu){toast("Aperçu : rien n'est envoyé.");return}
    try{localStorage.setItem("paysapro-ouvrier-nom",r.auteurNom.trim())}catch(err){}
    r.auteurId="";r.envoyeLe=new Date().toISOString();delete r.photos;
    if(await save(EQ.rapports,r,"Rapport prêt : envoyez-le maintenant.")){draft=null;go("mesrapports",null,r.id)}}
});
main.addEventListener("input",e=>{const el=e.target;if(!draft)return;if((el.id==="r_mis"||el.dataset.f==="dechets")&&(route.tab==="rapport"))rerender()});

boot();
})();
</script>
