/* App mobile d'abord : en-tête dégradé CŌNE, contenu en une colonne (max 720px), onglets en bas */
:root{
  --bg:#f4f6ef; --surface:#ffffff; --fg:#18200f; --muted:#5d6852; --line:#dde4d2; --chip:#edf2e3;
  --yellow:#FFE600; --lime:#B4F500; --green:#12D94A; --ink:#142000; --ink-fg:#e8ff7a;
  --ok:#0c7a2a; --ok-bg:#dcf5e1; --warn:#8a4a0c; --warn-bg:#fbe8d4; --bad:#8d1f1f; --bad-bg:#f8dcdc; --info-bg:#e9f0dc;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10140c; --surface:#1a2013; --fg:#eef3e6; --muted:#a3ae97; --line:#2c3523; --chip:#242c1b;
  --ink:#e8ff7a; --ink-fg:#142000; --ok:#6fe08a; --ok-bg:#16351e; --warn:#f3b46e; --warn-bg:#3a2a14; --bad:#f39a9a; --bad-bg:#3d1c1c; --info-bg:#252e1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10140c; --surface:#1a2013; --fg:#eef3e6; --muted:#a3ae97; --line:#2c3523; --chip:#242c1b;
  --ink:#e8ff7a; --ink-fg:#142000; --ok:#6fe08a; --ok-bg:#16351e; --warn:#f3b46e; --warn-bg:#3a2a14; --bad:#f39a9a; --bad-bg:#3d1c1c; --info-bg:#252e1a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--yellow)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(90deg,var(--yellow) 0%,var(--lime) 48%,var(--green) 100%);color:#fff;text-shadow:0 1px 2px rgba(0,60,20,.2);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hd{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.icon{flex:none;width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--yellow),var(--lime) 48%,var(--green));box-shadow:0 0 0 2px rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;letter-spacing:-1px}
.logo{font-weight:700;font-size:21px;letter-spacing:-.04em;line-height:1}
.logo small{display:block;font-size:8px;letter-spacing:4px;margin-top:3px}
.hd .gear{margin-left:auto;background:rgba(255,255,255,.25);border:0;border-radius:10px;color:#fff;font:600 13px var(--font);padding:9px 12px;cursor:pointer;text-shadow:inherit}
main{max-width:720px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:600}
p{margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:12.5px;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
button.card{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:20px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--info-bg);color:var(--fg)}
.row>.pill{white-space:normal;text-align:center;max-width:55%;line-height:1.3} main{overflow-x:clip}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font:600 14px var(--font);background:var(--ink);color:var(--ink-fg);cursor:pointer;min-height:44px}
a.btn{text-decoration:none} .btn.alt{background:var(--chip);color:var(--fg)} .btn.danger{background:var(--bad-bg);color:var(--bad)} .btn.full{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.photo{position:relative;border-radius:10px;overflow:hidden;background:var(--chip);aspect-ratio:1}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .tag{position:absolute;left:4px;bottom:4px;background:rgba(20,32,0,.75);color:#fff;font:600 11px var(--font);border-radius:6px;padding:2px 6px}
.photo .x{position:absolute;right:4px;top:4px;background:rgba(20,32,0,.75);color:#fff;border:0}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:7px 12px;font:500 13px var(--font);cursor:pointer;min-height:36px}
.chip.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:15px var(--font);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-height:44px}
textarea{min-height:70px;resize:vertical}
.btn:focus-visible,.chip:focus-visible,button.card:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 74px 84px 36px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.line input{min-height:38px;padding:6px 8px;font-size:14px}
.line .x{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;min-height:38px}
.tot{display:grid;grid-template-columns:1fr auto;gap:3px 12px;margin-top:10px}
.tot .big{font-weight:700;font-size:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
.tab{border:0;background:none;font:500 10.5px var(--font);color:var(--muted);padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab[aria-current="page"]{color:var(--fg)} .tab[aria-current="page"] svg{stroke:var(--green)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--ink-fg);border-radius:12px;padding:10px 14px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.copybox{width:100%;min-height:160px;font:13px/1.5 var(--mono)}
.todo{display:flex;gap:10px;align-items:flex-start}
.todo .pill{flex:none}
a.link{color:var(--fg);font-weight:600}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left;min-height:44px}
.check .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px}
.check.done .box{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.check.done span:last-child{text-decoration:line-through;color:var(--muted)}
.opt{font-size:11px;display:flex;gap:4px;align-items:center;color:var(--muted);margin-top:2px}
.opt input{width:auto;min-height:0}
.back{background:none;border:0;color:var(--muted);font:500 14px var(--font);padding:4px 0;margin-bottom:6px;cursor:pointer}
.mstrip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.mstrip span{font:600 11px var(--font);text-align:center;padding:6px 0;border-radius:5px;background:var(--chip);color:var(--muted)}
.mstrip span.on{background:var(--green);color:#042b10}.mstrip span.fl{background:var(--yellow);color:#3a3300}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px}.lg.on{background:var(--green)}.lg.fl{background:var(--yellow)}
.kv{display:grid;grid-template-columns:minmax(92px,32%) minmax(0,1fr);gap:7px 12px;margin-top:8px;font-size:14px}
.kv>span:nth-child(odd){color:var(--muted);font-size:12.5px;padding-top:1px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<script>
window.CONE_SB={"url": "https://eecnfkddxsgminbrwerq.supabase.co", "key": "sb_publishable_GCCXG8t2ni8O8A9wb9fWMA_qjQ2c2Vq"};
/* CŌNE : synchronisation en ligne (Supabase), sans bibliothèque externe.
   Branchée sur le shim : window.__coneSync(api) reçoit les fonctions internes du shim. */
window.__coneSyncInit=function(K){
"use strict";
const SB=window.CONE_SB;if(!SB||!SB.url||!SB.key)return null;
const URLB=SB.url.replace(/\/$/,"");
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let sess=null;try{sess=JSON.parse(lsGet("cone-session")||"null")}catch(e){}
let role=null,etat="";const subs=new Set();
const setEtat=t=>{etat=t;subs.forEach(f=>{try{f()}catch(e){}})};

async function authReq(path,body){const r=await fetch(URLB+"/auth/v1/"+path,{method:"POST",headers:{apikey:SB.key,"content-type":"application/json"},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.msg||j.error_description||j.message||("Erreur "+r.status));e.status=r.status;e.code=j.error_code||j.code;throw e}return j}
function keep(j){sess={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,uid:j.user&&j.user.id||sess&&sess.uid,email:j.user&&j.user.email||sess&&sess.email};lsSet("cone-session",JSON.stringify(sess))}
let refreshing=null;
async function token(){if(!sess)throw Object.assign(new Error("non connecté"),{status:401});
  if(Date.now()>sess.exp-60000){refreshing=refreshing||authReq("token?grant_type=refresh_token",{refresh_token:sess.rt}).then(keep).finally(()=>{refreshing=null});await refreshing}
  return sess.at}
async function api(path,opt){opt=opt||{};for(let i=0;i<2;i++){
  const h={apikey:SB.key,Authorization:"Bearer "+await token(),...(opt.headers||{})};
  const r=await fetch(URLB+path,{...opt,headers:h});
  if(r.status===401&&i===0&&sess){sess.exp=0;continue}
  if(!r.ok){const t=await r.text().catch(()=>"");const e=new Error(t||("Erreur "+r.status));e.status=r.status;throw e}
  return r}}
const jsonApi=async(path,opt)=>{const r=await api(path,opt);const t=await r.text();return t?JSON.parse(t):null};

/* ---------- file d'attente des envois ---------- */
let queue={},blobsUp={},lastPull="";
async function loadState(){queue=(await K.kvGet("queue"))||{};blobsUp=(await K.kvGet("blobsUp"))||{};lastPull=(await K.kvGet("lastPull"))||""}
const saveQ=()=>K.kvSet("queue",queue).catch(()=>{});
function enqueue(col,id,data,deleted){queue[col+"\u0001"+id]={col,id,data:deleted?null:data,deleted:!!deleted};saveQ();schedule(400)}
function enqueueBlob(id){delete blobsUp[id];K.kvSet("blobsUp",blobsUp).catch(()=>{});schedule(400)}
async function delBlob(id){try{await api("/storage/v1/object/photos/"+encodeURIComponent(id),{method:"DELETE"})}catch(e){}delete blobsUp[id];K.kvSet("blobsUp",blobsUp).catch(()=>{})}

let timer=null,running=false,again=false;
function schedule(ms){clearTimeout(timer);timer=setTimeout(cycle,ms)}
async function push(){
  const items=Object.entries(queue);if(!items.length)return;
  for(let i=0;i<items.length;i+=200){const part=items.slice(i,i+200);
    await api("/rest/v1/docs",{method:"POST",headers:{"content-type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(part.map(([,o])=>({col:o.col,id:o.id,data:o.data,deleted:o.deleted})))});
    part.forEach(([k,o])=>{if(queue[k]===o)delete queue[k]})}
  await saveQ()}
async function pushBlobs(){
  if(role!=="patron"&&role!=="ouvrier")return;
  for(const id of await K.blobIds()){if(blobsUp[id])continue;const b=await K.blobGet(id);if(!b)continue;
    await api("/storage/v1/object/photos/"+encodeURIComponent(id),{method:"POST",headers:{"content-type":b.type||"image/jpeg","x-upsert":"true"},body:b});
    blobsUp[id]=1;await K.kvSet("blobsUp",blobsUp)}}
async function pull(){
  const since=lastPull?new Date(new Date(lastPull).getTime()-120000).toISOString():"";
  let off=0,max=lastPull;const changed=new Set();const first=!lastPull;const seen=new Set();
  for(;;){const rows=await jsonApi("/rest/v1/docs?select=col,id,data,deleted,updated_at"+(since?"&updated_at=gt."+encodeURIComponent(since):"")+"&order=updated_at.asc,col.asc,id.asc&limit=500&offset="+off);
    for(const r of rows){seen.add(r.col+"\u0001"+r.id);if(!max||r.updated_at>max)max=r.updated_at;
      if(queue[r.col+"\u0001"+r.id])continue;
      if(K.apply(r.col,r.id,r.deleted?undefined:r.data))changed.add(r.col)}
    if(rows.length<500)break;off+=500}
  if(first&&role==="patron"){/* 1re synchro de cet appareil : envoyer ce qui n'existe qu'ici */
    for(const[col,docs]of Object.entries(K.mem())){for(const id of Object.keys(docs||{})){if(!seen.has(col+"\u0001"+id))queue[col+"\u0001"+id]={col,id,data:docs[id],deleted:false}}}

"use strict";
const DBN="cone-autonome",ST="kv",BL="blobs";

function openIdb(){return new Promise((ok,ko)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(ST))d.createObjectStore(ST);if(!d.objectStoreNames.contains(BL))d.createObjectStore(BL)};r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)})}
function tx(store,mode,fn){return new Promise((ok,ko)=>{const t=idb.transaction(store,mode);const s=t.objectStore(store);let res;const q=fn(s);if(q)q.onsuccess=()=>{res=q.result};t.oncomplete=()=>ok(res);t.onerror=()=>ko(t.error);t.onabort=()=>ko(t.error)})}
const kvGet=k=>tx(ST,"readonly",s=>s.get(k));
const kvSet=(k,v)=>tx(ST,"readwrite",s=>s.put(v,k));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};

  if(idb){try{const keys=await tx(BL,"readonly",s=>s.getAllKeys());const vals=await tx(BL,"readonly",s=>s.getAll());(keys||[]).forEach((k,i)=>{if(vals[i])blobUrl.set(k,URL.createObjectURL(vals[i]))})}catch(e){}}

}

function snapDoc(path){const i=path.lastIndexOf("/");const col=path.slice(0,i),id=path.slice(i+1);const v=(mem[col]||{})[id];return{id,exists:v!==undefined,data:()=>clone(v)}}
function notify(col,id){(colL[col]||[]).forEach(cb=>{try{cb(snapCol(col))}catch(e){console.error(e)}});(docL[col+"/"+id]||[]).forEach(cb=>{try{cb(snapDoc(col+"/"+id))}catch(e){console.error(e)}})}
function docRef(col,id){return{
  async set(data){mem[col]=mem[col]||{};mem[col][id]=clone(data);persist();if(sync)sync.enqueue(col,id,clone(data),false);setTimeout(()=>notify(col,id));},
  async delete(){if(mem[col])delete mem[col][id];persist();if(sync)sync.enqueue(col,id,null,true);setTimeout(()=>notify(col,id));},
  async get(){return snapDoc(col+"/"+id)},
  onSnapshot(cb){const p=col+"/"+id;(docL[p]=docL[p]||[]).push(cb);setTimeout(()=>cb(snapDoc(p)));return()=>{docL[p]=docL[p].filter(x=>x!==cb)}}}}

  collection(col){return{doc:id=>docRef(col,id),onSnapshot(cb){(colL[col]=colL[col]||[]).push(cb);setTimeout(()=>cb(snapCol(col)));return()=>{colL[col]=colL[col].filter(x=>x!==cb)}}}},
  doc(path){const i=path.lastIndexOf("/");return docRef(path.slice(0,i),path.slice(i+1))}};

/* ---------- calculs ---------- */
function evacCost(ev){
  if(!ev||!ev.on)return 0;
  const site=S.cfg.decharges.find(d=>d.id===ev.site)||{t:0,f:0};
  const dump=Math.max(num(ev.t)*num(site.t),num(site.min))+num(site.f);
  return (dump+num(ev.km)*S.cfg.kmCost+num(ev.h)*S.cfg.taux)*(1+S.cfg.marge);
}
function devisTotals(d){
  const lignes=(d.lignes||[]).filter(l=>!l.opt).reduce((s,l)=>s+num(l.q)*num(l.p),0);const options=(d.lignes||[]).filter(l=>l.opt).reduce((s,l)=>s+num(l.q)*num(l.p),0);
  const ev=evacCost(d.evac);const ht=lignes+ev;const tva=ht*num(d.tva)/100;
  return{lignes,options,ev,ht,tva,ttc:ht+tva,acompte:(ht+tva)*num(d.acompte)/100,eh:num(d.heuresEst)?lignes/num(d.heuresEst):0};
}
function tauxFor(o){if(!o)return S.cfg.taux;const ch=o.chantierId&&S.chantiers.find(x=>x.id===o.chantierId);return num(o.taux)||(ch&&num(ch.taux))||num(client(o.clientId)?.taux)||S.cfg.taux}
function tauxPill(o){const t=tauxFor(o);return t!==S.cfg.taux?` <span class="pill">${t} €/h</span>`:""}
function devisHT(c){const dv=S.devis.filter(d=>d.chantierId===c.id&&["accepté","facturé"].includes(d.statut));return dv.length?dv.reduce((s,d)=>s+devisTotals(d).ht,0):num(c.prixFixe)}
function isRegie(c){return c.mode?c.mode!=="devis":!S.devis.some(d=>d.chantierId===c.id&&["accepté","facturé"].includes(d.statut))}
function regieTotals(c){
  const hh=(c.heures||[]).reduce((s,h)=>s+num(h.hommes)*num(h.h),0);const taux=tauxFor(c);const mo=hh*taux;
  const coef=1+num(S.cfg.margeAchats)/100;
  const achatsL=[...(c.frais||[]).filter(f=>f.refact).map(f=>({n:(f.lib||f.cat),ht:num(f.montant)/1.21*coef})),...piecesDe(c.id).filter(p=>p.refact).map(p=>({n:p.lib||p.fournisseur||p.cat,ht:pHT(p)*coef}))];
  const achats=achatsL.reduce((s,x)=>s+x.ht,0);
  const autres=(c.lignes||[]).reduce((s,l)=>s+num(l.q)*num(l.p),0);
  const ht=mo+achats+autres;const tx=num(client(c.clientId)?.tva??21);const tva=ht*tx/100;
  return{hh,taux,mo,achatsL,achats,autres,ht,tx,tva,ttc:ht+tva};
}

const MODES_PAIE=["Virement","Cash","Payconiq","Autre"];
const sumM=a=>(a||[]).reduce((s,p)=>s+num(p.m),0);
function aPayer(c){return isRegie(c)?regieTotals(c).ttc:devisHT(c)*(1+num(client(c.clientId)?.tva??21)/100)}
function encaisse(c){const du=aPayer(c);const P=c.paiements||[];const recu=sumM(P);const ancien=c.statut==="payé"&&!P.length;
  const paye=ancien?du:recu;const reste=c.statut==="payé"?0:Math.max(0,du-recu);
  return{du,recu:paye,reste,pourb:sumM(c.pourboires),nbP:P.length,ancien,partiel:!ancien&&recu>0.005&&reste>0.005}}

  if(d.evac&&d.evac.on){const s=S.cfg.decharges.find(x=>x.id===d.evac.site);L.push(`Évacuation déchets verts (${d.evac.t} t, ${s?s.n:"décharge"}) : ${eur(t.ev)} HTVA`)}

  const opts=(d.lignes||[]).filter(l=>l.opt);if(opts.length){L.push("","Options (non comprises dans le total) :");opts.forEach(l=>L.push(`${l.n} : ${l.q} ${l.u} × ${eur(l.p)} = ${eur(num(l.q)*num(l.p))} HTVA`))}

  const sign="\n\nAlexandre\nCŌNES Colors";
  if(kind==="confirm")return`${bonjour}\n\nJe vous confirme notre passage le ${fdate(obj.date)} pour : ${obj.titre||obj.type}.\nN'hésitez pas à me prévenir si l'accès pose problème.${sign}`;
  if(kind==="veille")return`${bonjour}\n\nPetit rappel : nous passons demain (${fdate(obj.date)}) pour ${(obj.titre||obj.type||"").toLowerCase()}. Merci de laisser l'accès libre${obj.type==="Terrasse"||obj.type==="Toiture"?" et un robinet d'eau disponible":""}.${sign}`;
  if(kind==="fini")return`${bonjour}\n\nLe chantier « ${obj.titre||obj.type} » est terminé. Je vous envoie le décompte des heures et des achats dans les prochains jours. Merci pour votre confiance !${sign}`;
  if(kind==="avis")return`${bonjour}\n\nMerci encore pour votre confiance. Si vous êtes satisfait du travail, un avis sur notre fiche Google « CŌNES Colors » nous aiderait beaucoup. Il suffit de chercher CŌNES Colors sur Google Maps et de cliquer sur « Donner un avis ».${sign}`;
  if(kind==="relancePaie"){const t=regieTotals(obj);const e=encaisse(obj);return`${bonjour}\n\nSauf erreur de ma part, le décompte des travaux « ${obj.titre||obj.type} » envoyé le ${fdate(obj.envoyeLe||obj.date)} (${eur(t.ttc)} TVAC) ${e.partiel?`n'est réglé qu'en partie : j'ai bien reçu ${eur(e.recu)}, merci ! Il reste ${eur(e.reste)} à payer.`:"n'est pas encore réglé."} Pourriez-vous faire le nécessaire ? Si c'est déjà fait, merci de ne pas tenir compte de ce message.${sign}`}
  if(kind==="relance")return`${bonjour}\n\nJe reviens vers vous concernant le devis ${obj.numero} (${obj.objet||"travaux"}) envoyé le ${fdate(obj.sentAt||obj.date)}. Avez-vous pu le regarder ? Je reste disponible pour l'ajuster ou en parler.${sign}`;
  return"";
}

const main=document.getElementById("main");
main.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="qClient"){route.sub=el.value;const pos=el.selectionStart;render();const n=document.getElementById("qClient");n.focus();n.setSelectionRange(pos,pos);return}
  if(!draft)return;
  if(el.dataset.nc){draft._nc[el.dataset.nc]=el.value;if(el.dataset.nc==="adresse")upMap(el);return}
  if(el.dataset.f==="adresse")upMap(el);

  if(["dechKg","dechCout","dechPrixT","dechFactT"].includes(el.dataset.f)&&route.tab==="chantiers"){draft[el.dataset.f]=el.value;if(draft.dechMode==="poids")majEvacPoids(draft);softTotals();return}
  if(el.dataset.f==="dechSite"&&route.tab==="chantiers"){draft.dechSite=el.value;delete draft.dechPrixT;rerender();return}
  if(el.dataset.f==="m3"&&route.tab==="chantiers"){draft.m3=el.value;if(draft.mode!=="devis"){if(draft.dechMode!=="poids")majEvac(draft);softTotals()}else{const o=document.getElementById("h_m3i");if(o)o.textContent=num(el.value)?`≈ ${nbVoyages(el.value)} voyage(s) avec la remorque · repris dans « Faire le devis »`:""}return}
  if(el.dataset.f==="prixFixe"){const o=document.getElementById("h_prixTot");const p=num(el.value);const tx=num(client(draft.clientId)?.tva??21);if(o)o.innerHTML=p?`TVA ${tx} % : ${eur(p*tx/100)} · <b>Total TVAC : ${eur(p*(1+tx/100))}</b>`:"Le prix global convenu avec le client, sans détail des heures."}
  if(el.dataset.f==="clientId"&&(route.tab==="chantiers"||route.tab==="notes")&&el.value!=="__new"){const old=client(draft.clientId)?.adresse||"";if(!draft.adresse||draft.adresse===old)draft.adresse=client(el.value)?.adresse||""}

  if(el.dataset.f==="clientId"&&draft._nc)delete draft._nc;
  if(el.dataset.f){let v=el.type==="checkbox"?el.checked:el.value;if(["tva","payeJour","taux","margeAchats","kmCost","tauxOuvrier","coutCamion","carbCamion","coutRemorque","essMachines","volRemorque","coutDecharge","freqSem","moisDebut","moisFin","prixPassage"].includes(el.dataset.f))v=num(v);if(el.dataset.f==="margePct"){draft.marge=num(v)/100;return}draft[el.dataset.f]=v;if(el.dataset.f==="statut"&&v==="envoyé"&&route.tab==="devis"&&!draft.sentAt)draft.sentAt=today();if(el.dataset.f==="statut"&&route.tab==="chantiers"){if(v==="décompte envoyé"&&!draft.envoyeLe)draft.envoyeLe=today();if(v==="payé"&&!draft.payeLe)draft.payeLe=today()}
    if(route.tab==="contrats"&&["freqSem","moisDebut","moisFin","prixPassage"].includes(el.dataset.f)){softTotals();return}

      await savePdf({...modelDevis(draft),kind:"FACTURE",numero:draft.factureNo,date:draft.factureLe,acompte:null,paye:(()=>{const ch=S.chantiers.find(x=>x.id===draft.chantierId);const r=ch?sumM(ch.paiements):0;const tt=devisTotals(draft).ttc;return r>0.005&&r<tt-0.005?{recu:r,reste:tt-r}:null})()},"Facture "+draft.factureNo+" "+cname(draft.clientId));rerender();break}
    case"factRegie":{if(!draft.factureNo){draft.factureNo=nextFacture();draft.factureLe=today();if(!await save("chantiers",draft))break}
      await savePdf(modelRegie(draft),"Facture "+draft.factureNo+" "+cname(draft.clientId));rerender();break}
    case"markTermine":draft.statut="terminé";if(await save("chantiers",draft,"Chantier terminé : décompte prêt."))rerender();break;
    case"markEnvoye":draft.statut="décompte envoyé";draft.envoyeLe=today();if(await save("chantiers",draft,"Décompte marqué envoyé."))rerender();break;
    case"markPaye":{const e=encaisse(draft);if(e.partiel)draft.paiements.push({d:today(),m:String(+e.reste.toFixed(2)),mode:"Virement"})}draft.statut="payé";draft.payeLe=today();if(await save("chantiers",draft,"Paiement noté."))rerender();break;
    case"dupDevis":{const c=JSON.parse(JSON.stringify(draft));c.id=uid();c.numero=nextNumero();c.date=today();c.statut="brouillon";delete c.sentAt;route={tab:"devis",id:"new",sub:null};draft=c;rerender();toast("Copie créée : pensez à enregistrer.");break}
    case"toDecompte":{const c=draft;if(!(c.heures||[]).length){toast("Aucune heure pointée sur ce chantier.");break}
      const byM={};c.heures.forEach(h=>{const m=(h.d||today()).slice(0,7);(byM[m]=byM[m]||[]).push({d:h.d||today(),hommes:num(h.hommes)||1,h:num(h.h),note:c.titre||c.type||""})});
      let okAll=true;for(const m of Object.keys(byM)){const id=c.clientId+"_"+m;const ex=S.decomptes.find(x=>x.id===id);const dc=ex?JSON.parse(JSON.stringify(ex)):{id,clientId:c.clientId,mois:m,jours:[],payeJour:S.cfg.payeJour};
        const nouveaux=byM[m].filter(j=>!(dc.jours||[]).some(x=>x.d===j.d&&num(x.h)===j.h&&num(x.hommes)===j.hommes));dc.jours=[...(dc.jours||[]),...nouveaux];if(!await save("decomptes",dc)){okAll=false;break}}
      if(!okAll)break;c.statut="payé"===c.statut?c.statut:"décompte envoyé";c.envoyeLe=c.envoyeLe||today();c.decompteST=true;
      if(await save("chantiers",c,"Heures ajoutées au décompte de sous-traitance.")){const m=Object.keys(byM).sort().pop();go("decomptes",c.clientId+"_"+m)}break}
    case"newContrat":go("contrats","new");break;
    case"saveContrat":if(!await ensureNewClient())break;if(!draft.clientId){toast("Choisissez le client.");break}if(await save("contrats",draft,"Contrat enregistré."))go("contrats");break;
    case"delContrat":await confirmDel("contrats","supprimer ce contrat");break;
    case"passage":{const k=S.contrats.find(x=>x.id===b.dataset.id);if(!k)break;
      const ch={id:uid(),clientId:k.clientId,titre:k.titre,type:k.type,adresse:"",date:k.prochain||today(),statut:"prévu",kit:[...(S.cfg.kits[k.type]||[])],checklist:(CHECK[k.type]||[]).map(t=>({t,done:false})),heures:[],frais:[],lignes:fraisDefaut(),note:k.note||"",m3:"",contratId:k.id,created:today()};
      if(await save("chantiers",ch)){const{id,...kk}=k;await save("contrats",{...kk,id,prochain:nextPassage(k,k.prochain||today())},"Passage du "+fdate(ch.date)+" planifié.");go("chantiers",ch.id)}break}
    case"addOuv":draft.ouvriers=draft.ouvriers||[];draft.ouvriers.push({id:uid(),nom:"",taux:0});rerender();break;
    case"addCat":draft.catalogue.push({n:"Nouvelle prestation",u:"forfait",p:0});rerender();break;
    case"saveCfg":try{const{...c}=draft;c.taux=num(c.taux);c.kmCost=num(c.kmCost);c.payeJour=num(c.payeJour);c.margeAchats=num(c.margeAchats);await store.saveCfg(c);toast("Réglages enregistrés.");go("accueil")}catch(err){toast("Enregistrement refusé.")}break;
  }
});
function copyOut(text,label){
  const out=document.getElementById("copyOut");if(!out)return;
  const show=()=>{out.innerHTML=`<label for="copyTa">${esc(label||"Texte à coller dans Smart")}</label><textarea id="copyTa" class="copybox" readonly>${esc(text)}</textarea>`;const ta=document.getElementById("copyTa");ta.focus();ta.select()};
  try{navigator.clipboard.writeText(text).then(()=>{toast(label?"Message copié.":"Copié. Collez-le dans Smart.");show()},()=>{show();toast("Sélectionné : copiez-le à la main.")})}catch(e){show()}
}

function csv(rows){return"\ufeff"+rows.map(r=>r.map(v=>{const s=typeof v==="number"?String(v).replace(".",","):String(v??"");return/[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(";")).join("\r\n")}
async function exportCsv(kind){
  let rows=[];
  if(kind==="devis"){rows=[["Numéro","Date","Client","Objet","Statut","HTVA","TVA %","TVA","TVAC"]];S.devis.forEach(d=>{const t=devisTotals(d);rows.push([d.numero,d.date,cname(d.clientId),d.objet||"",d.statut,+t.ht.toFixed(2),num(d.tva),+t.tva.toFixed(2),+t.ttc.toFixed(2)])})}
  if(kind==="decomptes"){rows=[["Mois","Donneur d'ordre","Date","Hommes","Heures","Heures-homme","Montant HTVA","Note"]];S.decomptes.forEach(dc=>(dc.jours||[]).forEach(j=>rows.push([dc.mois,cname(dc.clientId),j.d,num(j.hommes),num(j.h),num(j.hommes)*num(j.h),+(num(j.hommes)*num(j.h)*tauxFor(dc)).toFixed(2),j.note||""])))}
  if(kind==="frais"){rows=[["Date","Chantier","Client","Catégorie","Détail","Montant TVAC","Refacturé au client","Déclaré chez Smart"]];S.chantiers.forEach(c=>(c.frais||[]).forEach(f=>rows.push([f.d,c.titre,cname(c.clientId),f.cat,f.lib||"",num(f.montant),f.refact?"oui":"non",f.smart?"oui":"non"])))}
  if(kind==="pieces"){rows=[["Date","Type","Fournisseur","Détail","Catégorie","Chantier","Client","TVAC","TVA %","HTVA","TVA","Refacturé","Déclaré chez Smart","Photo"]];[...S.pieces].sort((a,b)=>(a.d||"").localeCompare(b.d||"")).forEach(p=>{const c=S.chantiers.find(x=>x.id===p.chantierId);const ht=pHT(p);rows.push([p.d,PTYPES[p.type]||p.type,p.fournisseur||"",p.lib||"",p.cat||"",c?c.titre||c.type:"Frais généraux",c?cname(c.clientId):"",num(p.ttc),num(p.tva),+ht.toFixed(2),+(num(p.ttc)-ht).toFixed(2),p.refact?"oui":"non",p.smart?"oui":"non",p.photo?"oui":"non"])})}
  if(kind==="paiements"){rows=[["Date","Type","Chantier","Client","Montant","Mode","Note"]];S.chantiers.forEach(c=>{(c.paiements||[]).forEach(p=>rows.push([p.d,"Paiement",c.titre||c.type,cname(c.clientId),num(p.m),p.mode||"",""]));(c.pourboires||[]).forEach(p=>rows.push([p.d,"Pourboire",c.titre||c.type,cname(c.clientId),num(p.m),"",p.note||""]))});rows=[rows[0],...rows.slice(1).sort((a,b)=>String(a[0]).localeCompare(String(b[0])))]}
  if(kind==="paieouv"){rows=[["Date","Ouvrier","Pour","Chantier","Heures","Montant payé","Mode","Note"]];[...S.paieouv].sort((a,b)=>(a.d||"").localeCompare(b.d||"")).forEach(p=>{const c=p.chantierId&&S.chantiers.find(x=>x.id===p.chantierId);rows.push([p.d,ouvrier(p.ouv)?.nom||"?",POUR[p.pour]||p.pour,c?(c.titre||c.type)+" · "+cname(c.clientId):"",num(p.h)||"",num(p.m),p.mode||"",p.note||""])})}
  if(kind==="heures"){rows=[["Date","Chantier","Client","Hommes","Heures","Heures-homme"]];S.chantiers.forEach(c=>(c.heures||[]).forEach(h=>rows.push([h.d,c.titre,cname(c.clientId),num(h.hommes),num(h.h),num(h.hommes)*num(h.h)])))}
  if(rows.length<2){toast("Rien à exporter pour l'instant.");return}
  let dl=null;try{dl=window.claude?.use?await window.claude.use("downloads"):null}catch(e){}
  const filename="CONE-"+kind+"-"+today()+".csv";
  if(!dl){toast("Téléchargement indisponible.");return}
  try{await dl.save({filename,data:csv(rows)});toast("Fichier "+filename+" prêt.")}catch(e){if(e&&e.code!=="declined")toast("Téléchargement refusé ("+(e.code||"erreur")+").")}
}

/* --- Plantes v36 : localisation du scan et client reconnu par l'adresse --- */
async function exifGps(file){try{
  const buf=await file.slice(0,262144).arrayBuffer();const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return null;
  let o=2;while(o<v.byteLength-4){const mk=v.getUint16(o);const len=v.getUint16(o+2);
    if(mk===0xFFE1&&v.getUint32(o+4)===0x45786966){const t=o+10;const le=v.getUint16(t)===0x4949;
      const u16=x=>v.getUint16(x,le),u32=x=>v.getUint32(x,le);
      const ifd=x=>{const n=u16(x);const m={};for(let i=0;i<n;i++){const e=x+2+i*12;m[u16(e)]={type:u16(e+2),cnt:u32(e+4),val:e+8}}return m};
      const i0=ifd(t+u32(t+4));if(!i0[0x8825])return null;const g=ifd(t+u32(i0[0x8825].val));
      const rat=en=>{if(!en)return null;const p=t+u32(en.val);const r=k=>u32(p+k*8)/(u32(p+k*8+4)||1);return r(0)+r(1)/60+r(2)/3600};
      const ref=en=>en?String.fromCharCode(v.getUint8(en.val)):"";
      let lat=rat(g[2]),lon=rat(g[4]);if(lat==null||lon==null||(!lat&&!lon))return null;
      if(ref(g[1])==="S")lat=-lat;if(ref(g[3])==="W")lon=-lon;return{lat,lon,acc:30,src:"photo"}}
    if((mk&0xFF00)!==0xFF00)break;o+=2+len}
  return null}catch(e){return null}}
function gpsNow(){return new Promise(res=>{if(!navigator.geolocation)return res(null);let done=false;const fin=x=>{if(!done){done=true;res(x)}};
  setTimeout(()=>fin(null),12000);
  try{navigator.geolocation.getCurrentPosition(p=>fin({lat:p.coords.latitude,lon:p.coords.longitude,acc:Math.round(p.coords.accuracy||0),src:"gps"}),err=>{plGeoErr=err&&err.code===1?"refusée":"indisponible";fin(null)},{enableHighAccuracy:true,timeout:11000,maximumAge:60000})}catch(e){fin(null)}})}
let plGeoErr="";
const distM=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const normAdr=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\b(rue|avenue|av|chaussee|ch|boulevard|bd|place|pl|square|sq|drève|dreve|clos|allee|chemin|straat|laan|de|du|des|la|le|les|l|d|van|der)\b/g," ").replace(/\s+/g," ").trim();
async function geoAdresse(g){try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=fr&lat=${g.lat.toFixed(6)}&lon=${g.lon.toFixed(6)}`,{headers:{Accept:"application/json"}});if(!r.ok)return null;const j=await r.json();const a=j.address||{};
  return{rue:a.road||a.pedestrian||a.footway||"",num:a.house_number||"",cp:a.postcode||"",ville:a.town||a.city||a.village||a.municipality||a.suburb||""}}catch(e){return null}}
function clientPres(g,ad){
  let best=null;
  S.clients.forEach(c=>{if(c.geo&&num(c.geo.lat)){const d=distM(g,c.geo);if(d<=Math.max(120,num(g.acc)*1.5)&&(!best||d<best.d))best={c,d,how:"position déjà connue"}}});
  if(best)return best;
  if(!ad||!ad.rue)return null;const rue=normAdr(ad.rue);if(!rue)return null;
  const L=S.clients.map(c=>{const a=normAdr(c.adresse);if(!a||!a.includes(rue))return null;const cp=(String(c.adresse).match(/\b\d{4}\b/)||[])[0];if(ad.cp&&cp&&cp!==ad.cp)return null;
    const nums=(a.replace(/\b\d{4}\b/g," ").match(/\b\d+[a-z]?\b/g)||[]);const n=parseInt(ad.num,10);const exact=!!n&&nums.some(x=>parseInt(x,10)===n);const proche=!!n&&nums.some(x=>Math.abs(parseInt(x,10)-n)<=4);return{c,exact,proche}}).filter(Boolean);
  const ex=L.filter(x=>x.exact);if(ex.length===1)return{c:ex[0].c,how:"même adresse"};
  const pr=L.filter(x=>x.proche);if(pr.length===1)return{c:pr[0].c,how:"même rue, numéro proche"};
  if(L.length===1&&!ad.num)return{c:L[0].c,how:"même rue"};return null}
const lieuTxt=ad=>ad?[[ad.rue,ad.num].filter(Boolean).join(" "),[ad.cp,ad.ville].filter(Boolean).join(" ")].filter(Boolean).join(", "):"";
const chantierDuJour=cid=>S.chantiers.filter(c=>c.clientId===cid&&(c.date===today()||c.statut==="en cours")&&!FINI.includes(c.statut)).sort((a,b)=>(a.date===today()?0:1)-(b.date===today()?0:1))[0];
async function plLocaliser(me,file,manuel){
  me._geo="📍 Recherche de votre position…";if(draft===me)rerender();
  let g=file?await exifGps(file):null;if(!g)g=await gpsNow();
  if(!g){delete me._geo;me.geoKo=plGeoErr||"indisponible";if(draft===me)rerender();if(manuel)toast("Position "+me.geoKo+" : vérifiez la localisation de Safari.");return}
  me.geo={lat:+g.lat.toFixed(6),lon:+g.lon.toFixed(6),acc:g.acc,src:g.src,d:new Date().toISOString()};delete me.geoKo;
  const ad=await geoAdresse(g);if(ad)me.lieu=lieuTxt(ad);
  const m=clientPres(me.geo,ad);delete me._geo;
  if(m&&(!me.clientId||manuel)){me.clientId=m.c.id;delete me._nc;const ch=chantierDuJour(m.c.id);if(ch)me.chantierId=ch.id;me.geoClient=m.how;toast("📍 Vous êtes chez "+m.c.nom+" ("+m.how+") : plante liée à ce client.")}
  else if(manuel)toast(m?"Déjà lié à "+cname(me.clientId)+".":"📍 Position notée"+(me.lieu?" : "+me.lieu:"")+". Aucun client à cette adresse.");
  if(me.r&&!me.kind&&S.plantes.some(x=>x.id===me.id))await save("plantes",plClean(me));
  if(draft===me)rerender();
}

  const{id,...d}=c;try{await store.save("clients",id,{...d,geo:{lat:p.geo.lat,lon:p.geo.lon,d:today()}})}catch(e){}}

  const dj=!p.clientId?S.chantiers.filter(c=>(c.date===today()||c.statut==="en cours")&&!FINI.includes(c.statut)&&client(c.clientId)?.type!=="sous-traitance"):[];
  const sug=!p.clientId&&!p._geo&&dj.length===1?`<div class="card" style="border:2px solid var(--green)"><b>Vous êtes chez ${esc(cname(dj[0].clientId))} ?</b><div class="small">Chantier du jour : ${esc(dj[0].titre||dj[0].type)}</div><div class="btns"><button class="btn" type="button" data-pact="geoOui" data-c="${esc(dj[0].id)}">✓ Oui, lier à ce client</button></div></div>`:"";

  if(p.geo)return`<p class="small" style="margin-top:8px">📍 ${p.lieu?esc(p.lieu):"Position notée"}${num(p.geo.acc)?" (± "+Math.round(p.geo.acc)+" m)":""}${p.clientId&&p.geoClient?` · <b style="color:var(--ok)">chez ${esc(cname(p.clientId))}</b> (${esc(p.geoClient)})`:""} · <a class="link" href="https://www.google.com/maps/search/?api=1&query=${p.geo.lat},${p.geo.lon}" target="_blank" rel="noopener">Carte ›</a> · <button type="button" class="link" data-pact="geo" style="background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:underline">Relocaliser</button></p>`+sug;
